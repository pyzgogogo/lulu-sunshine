<div class="back-paper">
  <div class="back-topline">
    <span>写给我最爱的噜噜</span>
    <svg class="back-paw" viewBox="0 0 36 36" aria-hidden="true"><ellipse cx="10" cy="12" rx="3.2" ry="4.5" transform="rotate(-22 10 12)"/><ellipse cx="18" cy="8" rx="3.1" ry="4.3"/><ellipse cx="26" cy="12" rx="3.2" ry="4.5" transform="rotate(22 26 12)"/><path d="M8.5 24c0-4 5.4-10.3 9.5-10.3S27.5 20 27.5 24c0 3.8-3.2 5.1-5.8 4.2-2.3-.8-5.1-.8-7.4 0-2.6.9-5.8-.4-5.8-4.2Z"/></svg>
  </div>

  <header class="back-heading">
    <div class="back-portrait"><img src="./assets/subject.png" alt="噜噜抬起小爪的模样" draggable="false"></div>
    <div class="back-title-group">
      <p class="back-name">噜噜 <span>· 一直被爱着</span></p>
      <h2>阳光里，仍有你</h2>
      <span class="back-title-rule" aria-hidden="true"></span>
    </div>
  </header>

  <div class="back-letter">
    <p>我记得你伸出小爪的认真，<br>也记得你望过来时，眼睛里的光。</p>
    <p>想你的时候，可以笑，也可以难过。<br>那些一起度过的小小日常，<br>我都会轻轻地留着。</p>
  </div>

  <section class="back-memories" aria-label="翻看噜噜的小回忆">
    <div class="memory-tabs" role="group" aria-label="选择一个小回忆">
      <button type="button" class="memory-tab is-active" data-memory="paw" aria-pressed="true">小爪爪</button>
      <button type="button" class="memory-tab" data-memory="sun" aria-pressed="false">晒太阳</button>
      <button type="button" class="memory-tab" data-memory="eyes" aria-pressed="false">亮眼睛</button>
    </div>
    <p id="memory-line" class="memory-line" aria-live="polite">你抬起的小爪，好像还在轻轻碰我的手。</p>
  </section>

  <div class="back-note-area">
    <button id="write-note" class="write-note" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 13 9-9 3 3-9 9-4 1 1-4Zm7-7 3 3"/></svg><span>留一句想念</span></button>
    <p id="saved-note" class="saved-note" hidden></p>
  </div>

  <footer class="back-signoff"><span aria-hidden="true">✧</span> 那些被你照亮的日子，会一直在 <span aria-hidden="true">✧</span></footer>
</div>
